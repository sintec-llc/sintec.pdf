name: mac-debug
on:
  push:
    branches: [debug/mac-xattr]
jobs:
  t:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pdfcraft-platform
      - run: cargo test -p pdfcraft-automation --test it
      - run: cargo test -p pdfcraft-ui-egui --lib
      - run: cargo test -p pdfcraft-ui-egui --test it -- --skip perf
