name: mac-debug
on:
  push:
    branches: [debug/mac-xattr]
jobs:
  t:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pdfcraft-platform zz_debug -- --nocapture
