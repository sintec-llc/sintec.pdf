name: Upstream sync

# Weekly: list what upstream PdfCraft (github.com/storytold/pdfcraft) changed that we don't have
# (security and crash fixes, and the areas where we differ: OCR, printing, Office, scanning),
# keeping an issue open while upstream security fixes are missing; then merge the newest release
# tag into a sync/upstream-<tag> branch and open a draft pull request, or open an issue when the
# merge conflicts. See docs/upstream-sync.md for the rest of the process.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find the newest upstream release
        id: up
        run: |
          git remote add upstream https://github.com/storytold/pdfcraft.git
          # Upstream's tags go to their own namespace: both projects tag releases v0.1.x, and
          # fetching them as plain tags fails ("would clobber existing tag") on our own.
          git fetch --quiet --no-tags upstream "+refs/heads/main:refs/remotes/upstream/main" "+refs/tags/v*:refs/upstream-tags/v*"
          tag="$(git for-each-ref --merged upstream/main --sort=-v:refname --format='%(refname:lstrip=2)' 'refs/upstream-tags/v*' | head -n 1)"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          if [ -z "$tag" ] || git merge-base --is-ancestor "refs/upstream-tags/$tag" HEAD; then
            echo "state=current" >>"$GITHUB_OUTPUT"
            echo "Up to date with upstream ${tag:-(no release)}." >>"$GITHUB_STEP_SUMMARY"
          elif git ls-remote --exit-code --heads origin "sync/upstream-$tag" >/dev/null; then
            echo "state=proposed" >>"$GITHUB_OUTPUT"
            echo "sync/upstream-$tag already exists; nothing to do." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "state=new" >>"$GITHUB_OUTPUT"
          fi

      - name: List notable upstream changes
        run: |
          # Upstream commits we lack, leaving out ones already cherry-picked (same patch).
          git log --no-merges --cherry-pick --right-only \
            --format='- %s ([%h](https://github.com/storytold/pdfcraft/commit/%H), %as)' HEAD...upstream/main >missing.txt || true
          pick() { grep -i -E "$1" missing.txt | head -n 40 || true; }
          pick 'security|audit finding|vulnerab|cve-' >security.txt
          pick '(^- fix|crash|panic|overflow|hang|never crash)' | grep -v -i -E 'security|audit finding' >fixes.txt || true
          pick '(ocr|print|spool|office|word|excel|powerpoint|scan|twain|wia|m10)' >ours.txt
          {
            echo "### Upstream changes we don't have yet"
            echo
            echo "Upstream \`main\` has $(wc -l <missing.txt) commits we don't (cherry-picked ones excluded)."
            for section in "Security:security.txt" "Crash and wrong-result fixes:fixes.txt" "OCR, printing, Office, scanning (where we differ; docs/upstream-sync.md §M10):ours.txt"; do
              title="${section%%:*}"; file="${section##*:}"
              echo
              echo "**$title** ($(wc -l <"$file"))"
              echo
              if [ -s "$file" ]; then cat "$file"; else echo "- none"; fi
            done
          } >highlights.md
          cat highlights.md >>"$GITHUB_STEP_SUMMARY"

      - name: Keep an issue open for missing upstream security fixes
        run: |
          title="Upstream security fixes to pick up"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ ! -s security.txt ]; then
            if [ -n "$number" ]; then gh issue close "$number" --comment "Every upstream security fix is in main now."; fi
            exit 0
          fi
          {
            echo "Upstream PdfCraft has security fixes that \`main\` doesn't (docs/upstream-sync.md: cherry-pick them right away, \`git cherry-pick -x <commit>\`):"
            echo
            cat security.txt
            echo
            echo "Updated by the weekly Upstream sync workflow; closed by it once they are all in."
          } >security.md
          if [ -n "$number" ]; then gh issue edit "$number" --body-file security.md; else gh issue create --title "$title" --body-file security.md; fi

      - name: Merge it
        id: merge
        if: steps.up.outputs.state == 'new'
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          git config user.name "sintec-sync[bot]"
          git config user.email "sintec-sync@users.noreply.github.com"
          git switch -c "sync/upstream-$TAG"
          if git merge --no-ff --no-commit "refs/upstream-tags/$TAG"; then
            echo "clean=true" >>"$GITHUB_OUTPUT"
          else
            echo "clean=false" >>"$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U >conflicts.txt
            git merge --abort
          fi

      - name: Report conflicts
        if: steps.merge.outputs.clean == 'false'
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          title="Upstream sync: PdfCraft $TAG needs a manual merge"
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length' | grep -qv '^0$'; then
            echo "Issue already open." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "Merging upstream PdfCraft **$TAG** into \`main\` conflicts in:"
            echo
            sed 's/^/- `/; s/$/`/' conflicts.txt
            echo
            echo "Follow docs/upstream-sync.md: merge on \`sync/upstream-$TAG\`, resolve, \`cargo xtask rebrand\`, translate new strings into Russian, run the tests and build the installer."
            echo
            cat highlights.md
          } >body.md
          gh issue create --title "$title" --body-file body.md

      - uses: dtolnay/rust-toolchain@stable
        if: steps.merge.outputs.clean == 'true'

      - name: Rebrand, commit, push and open a draft pull request
        if: steps.merge.outputs.clean == 'true'
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          # Our CI, release workflows and README stay ours; upstream's versions are not used here.
          git checkout HEAD -- .github README.md
          cargo xtask rebrand
          git add -A
          git commit --quiet -m "Sync upstream PdfCraft $TAG"
          git push --quiet origin "sync/upstream-$TAG"
          {
            echo "Merges upstream PdfCraft **$TAG** (no conflicts; product name re-applied by \`cargo xtask rebrand\`)."
            echo
            echo "Before merging (docs/upstream-sync.md): CI green, including \`sintec_guard\` (Russian strings, branding);"
            echo "set our next version; build and try the installer; check upstream's changes to Windows printing, OCR and Office import (M10) against ours."
            echo
            cat highlights.md
          } >body.md
          gh pr create --draft --base main --head "sync/upstream-$TAG" --title "Sync upstream PdfCraft $TAG" --body-file body.md
          # Pushes made with GITHUB_TOKEN don't start other workflows; a dispatch does.
          gh workflow run ci.yml --ref "sync/upstream-$TAG"
