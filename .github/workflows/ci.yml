name: CI

# Sintec.PDF ships for Windows, macOS (Apple silicon and Intel) and Linux x86_64, so CI runs on
# all four. No
# schedule: nothing runs unless main changes, a pull request is opened, or it is started by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # No debug info or incremental state: faster CI and a much smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The OCR tests (English and Russian) need the models; the rest of the suite skips them
      # gracefully, but fetching them (SHA-256 verified) keeps OCR covered.
      - name: OCR models
        run: cargo xtask models

      - name: Test
        run: cargo test --workspace

      - name: Layering
        run: cargo xtask layers

      - name: Assets (licences and attribution)
        run: cargo xtask assets

  macos:
    name: test + DMG (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}

      # The macOS-only code paths (Apple events, the DMG updater, CUPS printing) get linted here.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: OCR models
        run: cargo xtask models

      # Every test binary runs, so one failure doesn't hide the rest.
      - name: Test
        run: cargo test --workspace --no-fail-fast

      # An ad-hoc signed DMG for this processor, to try before a release (Gatekeeper asks for
      # right-click > Open on other Macs; the release job signs and notarizes when it can).
      - name: DMG
        run: packaging/macos/package.sh --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  # Linux x86_64 (task 028): the Linux-only code paths (SANE scanning, CUPS printing, the
  # freedesktop app id, X11/Wayland windowing) get linted and tested here, and the packages are
  # built as artifacts so a pull request can be tried on a Linux desktop before a release.
  linux:
    name: test + packages (Linux x86_64)
    # The oldest GitHub-hosted image, as in release.yml: binaries built here need only glibc 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # egui/winit/wgpu (X11, Wayland, xkbcommon, GL), fontconfig, CUPS (lp, for the print
      # tests' tooling) and Xvfb for the tests that open a window or a clipboard.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
            libvulkan-dev libfontconfig1-dev libfreetype6-dev libcups2-dev libdbus-1-dev \
            libgtk-3-dev xvfb xauth

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: OCR models
        run: cargo xtask models

      # Headless: an X server on a virtual display for the tests that need one.
      - name: Test
        run: xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" cargo test --workspace --no-fail-fast

      - name: Layering
        run: cargo xtask layers

      - name: Assets (licences and attribution)
        run: cargo xtask assets

      # The AppImage, .deb and CLI tarball, unsigned, to try before a release.
      - name: Packaging tools
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream zsync file
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
        env:
          NFPM_VERSION: 2.47.0

      - name: Packages
        run: packaging/linux/package.sh --formats "appimage deb cli"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  deny:
    name: dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
