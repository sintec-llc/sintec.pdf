name: CI

# Sintec.PDF ships for Windows and macOS (Apple silicon and Intel), so CI runs on all three. No
# schedule: nothing runs unless main changes, a pull request is opened, or it is started by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # No debug info or incremental state: faster CI and a much smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The OCR tests (English and Russian) need the models; the rest of the suite skips them
      # gracefully, but fetching them (SHA-256 verified) keeps OCR covered.
      - name: OCR models
        run: cargo xtask models

      - name: Test
        run: cargo test --workspace

      - name: Layering
        run: cargo xtask layers

      - name: Assets (licences and attribution)
        run: cargo xtask assets

  macos:
    name: test + DMG (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}

      # The macOS-only code paths (Apple events, the DMG updater, CUPS printing) get linted here.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: OCR models
        run: cargo xtask models

      - name: Test
        run: cargo test --workspace

      # An ad-hoc signed DMG for this processor, to try before a release (Gatekeeper asks for
      # right-click > Open on other Macs; the release job signs and notarizes when it can).
      - name: DMG
        run: packaging/macos/package.sh --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  deny:
    name: dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
