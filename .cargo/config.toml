[alias]
xtask = "run -p xtask --"

[env]
# The UI tests find widgets by their English labels, but Auto follows the system display language,
# so on a Russian machine they would see translated text. `C` means English (see
# `i18n::lang_from_tag`); it covers `cargo run` too, where Preferences ▸ Interface language still
# switches. Installed builds aren't affected. An LC_ALL already set in the environment wins.
LC_ALL = "C"
# WebAssembly SIMD (every current browser has it; there's no runtime detection on wasm). The OCR
# engine's kernels (rten-simd) and other vectorised code only use it when compiled in.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
